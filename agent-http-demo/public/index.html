<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务化 Agent Demo</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    margin: 0; background: #f5f5f4; color: #1c1917;
    display: flex; flex-direction: column; height: 100vh;
  }
  header { padding: 14px 20px; background: #fff; border-bottom: 1px solid #e7e5e4; }
  header h1 { font-size: 16px; margin: 0; }
  header p { font-size: 12px; margin: 4px 0 0; color: #78716c; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: #fff; border: 1px solid #e7e5e4; border-bottom-left-radius: 4px; }
  .trace { margin-top: 8px; font-size: 11px; color: #78716c; border-top: 1px dashed #e7e5e4; padding-top: 6px; }
  .trace span { display: inline-block; background: #f5f5f4; border-radius: 4px; padding: 2px 6px; margin: 2px 4px 2px 0; }
  form { display: flex; gap: 8px; padding: 14px 20px; background: #fff; border-top: 1px solid #e7e5e4; }
  input { flex: 1; padding: 10px 14px; border: 1px solid #d6d3d1; border-radius: 8px; font-size: 14px; outline: none; }
  input:focus { border-color: #2563eb; }
  button { padding: 10px 18px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:disabled { background: #93c5fd; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <h1>服务化 Agent Demo</h1>
    <p>网页只是 HTTP 接口（POST /api/chat）的客户端之一 —— 用 curl 调这个接口效果完全一样</p>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="输入消息，例如：现在几点了？" autocomplete="off">
    <button id="send" type="submit">发送</button>
  </form>
<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const sessionId = "web-" + Math.random().toString(36).slice(2, 8);

  function addMsg(cls, text, trace) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    if (trace && trace.length) {
      const t = document.createElement("div");
      t.className = "trace";
      t.textContent = "执行轨迹：";
      trace.forEach((s) => {
        const tag = document.createElement("span");
        tag.textContent = s.type === "tool"
          ? "工具调用 " + s.name + " → " + s.content
          : "模型回复";
        t.appendChild(tag);
      });
      div.appendChild(t);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    addMsg("user", message);
    send.disabled = true;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, sessionId }),
      });
      const data = await res.json();
      if (data.error) addMsg("agent", "错误：" + data.error);
      else addMsg("agent", data.reply, data.trace);
    } catch (err) {
      addMsg("agent", "请求失败：" + err.message);
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
